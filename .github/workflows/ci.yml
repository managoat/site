# Every push and PR: the render has to succeed, the tests have to pass, and
# every link into the manual has to answer on managoat.com.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: erlef/setup-beam@e6d7c94229049569db56a7ad5a540c051a010af9 # v1.20.4
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@0400d5f644dc74513d3be3d4d0dbd6f2e09d3f61 # v4.3.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix site.build
      - run: mix site.check_links
