apiVersion: apps/v1
kind: Deployment
metadata:
  name: managoat-site
  namespace: managoat-site
  labels:
    app: managoat-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: managoat-site
  template:
    metadata:
      labels:
        app: managoat-site
    spec:
      containers:
        - name: web
          # Pinned to an immutable sha tag by .github/workflows/build.yml.
          image: ghcr.io/managoat/site:sha-0dd04c239568208fed4537b2bb25178d65c754d1
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 128Mi }
